[project]
name = "mcp-oauth-starter"
version = "0.1.0"
description = "A minimal remote MCP server with OAuth 2.1 resource-server authorization (spec 2026-07-28)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Specter Systems" }]
keywords = ["mcp", "model-context-protocol", "oauth", "oauth2", "claude"]

dependencies = [
    "mcp>=2.2.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.27", "cryptography>=42"]

[project.scripts]
mcp-oauth-starter = "mcp_oauth_starter.server:main"

[project.urls]
Homepage = "https://specter-systems.github.io"
Source = "https://github.com/specter-systems/mcp-oauth-starter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oauth_starter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
